[package]
name = "aegis"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.105"
axum = "0.8.9"
dotenv = "0.15.0"
getrandom = "0.4.3"
hex = "0.4.3"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
tokio = { version = "1", features = ["full"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["serde", "v4"] }
