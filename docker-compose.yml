services:
  node1:
    build: .
    container_name: aegis-node1
    environment:
      NODE_ID: node1
      NODE_ROLE: primary
      PORT: 8001
      DATABASE_URL: ${NODE1_DATABASE_URL}
      NODE2_URL: http://node2:8002
      NODE3_URL: http://node3:8003
      KEK: ${KEK}
    ports:
      - "8001:8001"
    depends_on:
      postgres1:
        condition: service_healthy
    networks:
        - aegis-network

  node2:
    build: .
    container_name: aegis-node2
    environment:
      NODE_ID: node2
      NODE_ROLE: replica
      PORT: 8002
      DATABASE_URL: ${NODE2_DATABASE_URL}
      KEK: ${KEK}
    ports:
      - "8002:8002"
    depends_on:
      postgres2:
        condition: service_healthy
    networks:
        - aegis-network

  node3:
    build: .
    container_name: aegis-node3
    environment:
      NODE_ID: node3
      NODE_ROLE: replica
      PORT: 8003
      DATABASE_URL: ${NODE3_DATABASE_URL}
      KEK: ${KEK}
    ports:
      - "8003:8003"
    depends_on:
      postgres3:
        condition: service_healthy
    networks:
        - aegis-network

  postgres1:
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres1_data:/var/lib/postgresql/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miles -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  postgres2:
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres2_data:/var/lib/postgresql/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miles -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres3:
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres3_data:/var/lib/postgresql/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miles -d aegis"]      
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres1_data:
  postgres2_data:
  postgres3_data:

networks:
  aegis-network:
    driver: bridge

